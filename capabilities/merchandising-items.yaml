naftiko: 1.0.0-alpha2
info:
  label: Oracle Retail Merchandising Foundation Cloud Service API — Items
  description: 'Oracle Retail Merchandising Foundation Cloud Service API — Items. 4 operations. Lead operation: List items.
    Self-contained Naftiko capability covering one Oracle Retail business surface.'
  tags:
  - Oracle Retail
  - Items
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ORACLE_RETAIL_API_KEY: ORACLE_RETAIL_API_KEY
capability:
  consumes:
  - type: http
    namespace: merchandising-items
    baseUri: https://{host}/MerchServices/MerchRes/v1
    description: Oracle Retail Merchandising Foundation Cloud Service API — Items business capability. Self-contained, no
      shared references.
    resources:
    - name: items
      path: /items
      operations:
      - name: listitems
        method: GET
        description: List items
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: department
          in: query
          type: integer
          description: Filter by department number
        - name: class
          in: query
          type: integer
          description: Filter by class number
        - name: subclass
          in: query
          type: integer
          description: Filter by subclass number
        - name: status
          in: query
          type: string
          description: Filter by item status
        - name: offset
          in: query
          type: integer
        - name: limit
          in: query
          type: integer
      - name: createitem
        method: POST
        description: Create an item
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: items-item
      path: /items/{item}
      operations:
      - name: getitem
        method: GET
        description: Get an item
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updateitem
        method: PUT
        description: Update an item
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.ORACLE_RETAIL_API_KEY}}'
  exposes:
  - type: rest
    namespace: merchandising-items-rest
    port: 8080
    description: REST adapter for Oracle Retail Merchandising Foundation Cloud Service API — Items. One Spectral-compliant
      resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/items
      name: items
      description: REST surface for items.
      operations:
      - method: GET
        name: listitems
        description: List items
        call: merchandising-items.listitems
        with:
          department: rest.department
          class: rest.class
          subclass: rest.subclass
          status: rest.status
          offset: rest.offset
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createitem
        description: Create an item
        call: merchandising-items.createitem
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/items/{item}
      name: items-item
      description: REST surface for items-item.
      operations:
      - method: GET
        name: getitem
        description: Get an item
        call: merchandising-items.getitem
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updateitem
        description: Update an item
        call: merchandising-items.updateitem
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: merchandising-items-mcp
    port: 9090
    transport: http
    description: MCP adapter for Oracle Retail Merchandising Foundation Cloud Service API — Items. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: list-items
      description: List items
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: merchandising-items.listitems
      with:
        department: tools.department
        class: tools.class
        subclass: tools.subclass
        status: tools.status
        offset: tools.offset
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
    - name: create-item
      description: Create an item
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: merchandising-items.createitem
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-item
      description: Get an item
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: merchandising-items.getitem
      outputParameters:
      - type: object
        mapping: $.
    - name: update-item
      description: Update an item
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: merchandising-items.updateitem
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
