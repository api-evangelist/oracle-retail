      - name: locationType
        type: string
        description: Location type (S=Store, W=Warehouse)
      outputParameters:
      - type: object
        mapping: $.
binds:
- namespace: env
  keys:
    ORACLE_RETAIL_TOKEN: ORACLE_RETAIL_TOKEN
