description: >-
  FOCUS-aligned FinOps view for Oracle Retail: per-application SaaS
  subscriptions billed against retail-specific metrics (Annual Subscriber
  Revenue, Hosted Named User, POS Lane / Store) on the Oracle Retail price
  list. REST API access is bundled with the subscription. FinOps observation
  centres on the per-application metric (revenue tier, seat count, lane /
  store count) rather than per-call consumption.
sources:
  - https://www.oracle.com/industries/retail/
  - https://docs.oracle.com/en/industries/retail/
notes: >-
  No per-API meter exists. Track the contractual metric per Retail Cloud
  Service (revenue tier, seat count, lane count) at each renewal cycle.
billingModel:
  pricingCategory: Tiered Subscription (Per Application)
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Tax
    - Adjustment
    - Credit
focusColumns:
  ServiceName: Oracle Retail
  ServiceCategory: Retail Applications
