meters:
  - name: annual_subscriber_revenue_tier
    description: Annual Subscriber Revenue tier on metered Retail Cloud Services
    unit: usd-annual-revenue
    aggregation: max
    dimensions:
      - service
      - business_unit
  - name: hosted_named_user_subscription
    description: Hosted Named User seats per month
    unit: seat-month
    aggregation: max
    dimensions:
      - service
      - role
  - name: pos_lane_subscription
    description: Active POS lanes per month for Xstore Point of Service
    unit: lane-month
    aggregation: max
    dimensions:
      - banner
      - region
  - name: store_subscription
    description: Active stores per month for Xstore Point of Service
    unit: store-month
    aggregation: max
    dimensions:
      - banner
      - region
  - name: rest_api_calls
    description: REST API calls (informational; bundled in the subscription)
    unit: request
    aggregation: sum
    dimensions:
      - service
      - api
      - endpoint
principles:
  - name: Visibility
    description: >-
      Maintain a tenancy-level inventory of Oracle Retail Cloud Service
      subscriptions, contractual metrics, and active lane / store counts;
      reconcile annually against the Oracle order document.
  - name: Allocation
    description: >-
      Tag each Retail subscription with the consuming banner, region, and
      business unit so spend can be attributed back to the operating
      business.
  - name: Optimization
    description: >-
      Reclaim inactive seats, decommission lanes for closed stores at the
      monthly snapshot, and prefer RICS bulk patterns over transactional
      REST integrations to reduce capacity pressure on the Retail Cloud pod.
  - name: Accountability
    description: >-
      Pair the Retail applications administrator with retail-finance and
      store-operations owners; review metric utilization at quarterly
      business reviews.
