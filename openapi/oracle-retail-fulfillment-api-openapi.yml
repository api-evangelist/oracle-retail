openapi: 3.2.0
info:
  title: Oracle Retail Order Management Suite Cloud Service…
  description: Oracle Retail Order Management Suite Cloud Service (OMS) provides REST APIs for omnichannel order orchestration, fulfillment, sourcing, returns management, and customer service across digital and physical retail channels.
  version: 26.1.0
  contact:
    name: Oracle Retail Support
    url: https://support.oracle.com
  license:
    name: Oracle Technology Network License
    url: https://www.oracle.com/legal/terms/
servers:
- url: https://{host}/oms/api/v1
  description: Oracle Retail OMS REST API
  variables:
    host:
      default: retail-oms.example.com
security:
- oauth2: []
tags:
- name: Fulfillment
  description: Fulfillment and sourcing operations
paths:
  /fulfillment/ship-order:
    post:
      operationId: shipOrder
      summary: Record a shipment
      description: Records a shipment event for fulfillment nodes, advancing order status.
      tags:
      - Fulfillment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipmentRequest'
      responses:
        '200':
          description: Shipment recorded
        '400':
          $ref: '#/components/responses/BadRequest'
components:
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
    ShipmentRequest:
      type: object
      required:
      - orderId
      - trackingNumber
      - carrier
      properties:
        orderId:
          type: string
        lineIds:
          type: array
          items:
            type: string
        trackingNumber:
          type: string
        carrier:
          type: string
        shipDate:
          type: string
          format: date-time
        estimatedDeliveryDate:
          type: string
          format: date-time
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://identity.oraclecloud.com/oauth2/v1/token
          scopes:
            oms.read: Read order data
            oms.write: Write order data
