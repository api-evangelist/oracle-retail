- name: Oracle Retail Integration Cloud Service API
  description: Oracle Retail Integration Cloud Service (RIB and BDI) provides messaging and bulk data integration
    APIs connecting Oracle Retail applications to third-party systems using enterprise messaging patterns.
  image: https://www.oracle.com/a/ocom/img/social-og-oracle-cloud.jpg
