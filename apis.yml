aid: oracle-retail
name: Oracle Retail
description: Oracle Retail is a suite of cloud and on-premises applications for retailers spanning merchandising,
  pricing, supply chain, omnichannel order management, point of service, and store operations. Oracle Retail APIs
  provide REST, messaging, and integration services for managing the full retail lifecycle across digital and physical
  channels.
